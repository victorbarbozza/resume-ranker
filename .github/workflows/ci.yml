name: ci

on:
  pull_request:
  workflow_call:

jobs:
  verify:
    name: 🧪 Verify and 🔮 Preview
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: resume_ranker_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U dev -d resume_ranker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PREVIEW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: 🔎 Lint, types, format, tests and build
        run: bun scripts/ci/verify.ts "$RUNNER_TEMP/verify.md"

      - name: 🔮 Preview
        if: ${{ !cancelled() && env.PREVIEW == 'true' }}
        run: infra/azure/scripts/pulumi-up.sh
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          STATE_STORAGE_ACCOUNT: ${{ secrets.STATE_STORAGE_ACCOUNT }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          PULUMI_PREVIEW: 'true'
          PULUMI_PREVIEW_JSON: ${{ runner.temp }}/preview.json

      - name: 💬 Comment
        if: ${{ !cancelled() && env.PREVIEW == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(bun scripts/ci/report.ts "$RUNNER_TEMP/verify.md" "$RUNNER_TEMP/preview.json")
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ci-report -->")) | .id' | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
