name: Setup
description: Node, Bun, the Pulumi CLI and the dependencies of the app and the infra

runs:
  using: composite
  steps:
    - name: ⎔ Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: 🧅 Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: 🟣 Setup Pulumi
      uses: pulumi/actions@v7

    - name: 📥 Install dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile
        cd infra/azure && bun install --frozen-lockfile
